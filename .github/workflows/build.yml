name: Build APK

# Every push builds the app, publishes the APK on the repository's Releases page, and then
# tries the app out on an Android emulator.
on:
  push:
    branches-ignore:
      - ci-results
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release and the test results

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download web libraries (terminal, icons, fonts)
        run: bash scripts/fetch-web-vendor.sh

      - name: Download the terminal's Linux system (PRoot, Alpine)
        run: bash scripts/fetch-linux-env.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: sign with a private key kept in the repository's secrets
      # (FCODE_KEYSTORE_BASE64, FCODE_KEYSTORE_PASSWORD, FCODE_KEY_ALIAS, FCODE_KEY_PASSWORD).
      # Without them the build is signed with the public test key from signing/.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FCODE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fcode-release.keystore"
            echo "FCODE_KEYSTORE_FILE=$RUNNER_TEMP/fcode-release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private key from the repository secrets."
          else
            echo "No private key in the repository secrets: signing with the public test key."
          fi

      - name: Build APK
        env:
          FCODE_KEYSTORE_PASSWORD: ${{ secrets.FCODE_KEYSTORE_PASSWORD }}
          FCODE_KEY_ALIAS: ${{ secrets.FCODE_KEY_ALIAS }}
          FCODE_KEY_PASSWORD: ${{ secrets.FCODE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          NDK_ARG=""
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_ARG="-PfcodeNdkVersion=$(basename "$ANDROID_NDK_LATEST_HOME")"
          fi
          echo "NDK argument: ${NDK_ARG:-none (Gradle picks its default)}"
          # The release build is what people install. The debug build is the same code with
          # inspection switched on, which the emulator test below needs.
          gradle --no-daemon --stacktrace assembleRelease assembleDebug $NDK_ARG 2>&1 | tee build-log.txt
          cp app/build/outputs/apk/release/app-release.apk Fcode.apk
          cp app/build/outputs/apk/debug/app-debug.apk Fcode-debug.apk
          ls -la Fcode.apk Fcode-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fcode-apk
          path: Fcode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fcode-debug-apk
          path: Fcode-debug.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release that always holds the newest build, so the download link never changes.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Fcode.apk \
            --title "Fcode - latest build (#${{ github.run_number }})" \
            --notes "Built from commit ${GITHUB_SHA::7} on branch ${GITHUB_REF_NAME}. Download Fcode.apk below and open it on your phone to install." \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: Keep the build log when the build fails
        if: failure()
        run: |
          mkdir -p results/build
          cp build-log.txt results/build/ 2>/dev/null || echo "The build did not get as far as Gradle." > results/build/build-log.txt
          bash scripts/publish-results.sh results "Build log for ${GITHUB_SHA::7} (failed)"
        env:
          GH_TOKEN: ${{ github.token }}

  # Installs the app on an emulator and uses it: storage folders, the editor's files, the Linux
  # terminal (packages, git, scripts) and Android's own shell. What it saw, with screenshots,
  # is pushed to the ci-results branch.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 30]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: Fcode-debug-apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 6000M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/emulator-test.mjs Fcode-debug.apk results/android-${{ matrix.api-level }}

      - name: Publish what the test saw
        if: always()
        run: bash scripts/publish-results.sh results "Emulator test (Android API ${{ matrix.api-level }}) for ${GITHUB_SHA::7}"
        env:
          GH_TOKEN: ${{ github.token }}
